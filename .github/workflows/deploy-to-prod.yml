name: "Terraforming prod"

on:
  push:
    branches:
      - 'main'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy-dev:
    name: "Terraforming prod"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: 'google-github-actions/auth@v3'
        with:
          project_id: 'tsm-prod-1dab'
          workload_identity_provider: 'projects/906118489000/locations/global/workloadIdentityPools/github-action/providers/github-oidc'
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
      - name: terraform init
        run: terraform init
        working-directory: terraform/env/prod
      - name: Plan terraform
        run: terraform plan
        working-directory: terraform/env/prod
        env:
          TF_VAR_slackbot_auth_token: ${{ secrets.SLACKBOT_AUTH_TOKEN }}
      - name: Apply terraform
        run: terraform apply -auto-approve
        working-directory: terraform/env/prod
        env:
          TF_VAR_slackbot_auth_token: ${{ secrets.SLACKBOT_AUTH_TOKEN }}
